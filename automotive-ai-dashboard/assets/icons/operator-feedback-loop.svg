<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Operator/User icon -->
  <circle cx="20" cy="20" r="8" stroke="#00E0FF" stroke-width="2.5" fill="none"/>
  <path d="M10 42 C10 34 14 30 20 30 C26 30 30 34 30 42" stroke="#00E0FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- System/Dashboard -->
  <rect x="38" y="38" width="20" height="16" rx="2" stroke="#00E0FF" stroke-width="2.5" fill="none"/>
  <line x1="42" y1="44" x2="54" y2="44" stroke="#00E0FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="48" x2="50" y2="48" stroke="#00E0FF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Feedback loop arrows -->
  <path d="M28 24 C34 24 40 28 42 34" stroke="#FFC857" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#feedback-arrow)"/>
  <path d="M42 50 C36 54 28 52 24 46 L24 42" stroke="#FFC857" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#feedback-arrow)"/>

  <!-- Data flow indicators -->
  <circle cx="34" cy="26" r="2" fill="#FFC857"/>
  <circle cx="30" cy="48" r="2" fill="#FFC857"/>

  <!-- Activity pulse on system -->
  <circle cx="48" cy="46" r="2" fill="#00E0FF"/>
  <circle cx="48" cy="46" r="4" stroke="#00E0FF" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Continuous improvement cycle indicator -->
  <circle cx="34" cy="38" r="8" stroke="#00E0FF" stroke-width="1.5" stroke-dasharray="3 2" fill="none" opacity="0.5"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="feedback-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FFC857" />
    </marker>
  </defs>

  <!-- 3D depth effect -->
  <circle cx="20" cy="20" r="8" stroke="#00E0FF" stroke-width="1" fill="none" opacity="0.2" transform="translate(1, 1)"/>
  <rect x="38" y="38" width="20" height="16" rx="2" stroke="#00E0FF" stroke-width="1" fill="none" opacity="0.2" transform="translate(1, 1)"/>
</svg>
