<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Physical machine (left) -->
  <rect x="8" y="20" width="20" height="24" rx="2" stroke="#004B87" stroke-width="2.5" fill="none"/>
  <circle cx="18" cy="32" r="6" stroke="#004B87" stroke-width="2" fill="none"/>
  <line x1="8" y1="44" x2="8" y2="52" stroke="#004B87" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="44" x2="28" y2="52" stroke="#004B87" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Digital twin (right) -->
  <rect x="36" y="20" width="20" height="24" rx="2" stroke="#00E0FF" stroke-width="2.5" fill="none"/>
  <circle cx="46" cy="32" r="6" stroke="#00E0FF" stroke-width="2" fill="none"/>
  <line x1="36" y1="44" x2="36" y2="52" stroke="#00E0FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="44" x2="56" y2="52" stroke="#00E0FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sensor data streams connecting them -->
  <path d="M28 24 L36 24" stroke="#FFC857" stroke-width="2" stroke-dasharray="2 2" opacity="0.8"/>
  <path d="M28 32 L36 32" stroke="#FFC857" stroke-width="2" stroke-dasharray="2 2"/>
  <path d="M28 40 L36 40" stroke="#FFC857" stroke-width="2" stroke-dasharray="2 2" opacity="0.8"/>

  <!-- Data particles flowing -->
  <circle cx="30" cy="24" r="1.5" fill="#FFC857"/>
  <circle cx="34" cy="32" r="1.5" fill="#FFC857"/>
  <circle cx="32" cy="40" r="1.5" fill="#FFC857"/>

  <!-- Sensor indicators on physical machine -->
  <circle cx="14" cy="26" r="2" fill="#004B87"/>
  <circle cx="22" cy="26" r="2" fill="#004B87"/>
  <circle cx="18" cy="38" r="2" fill="#FFC857"/>

  <!-- Real-time sync indicators on digital twin -->
  <circle cx="42" cy="26" r="2" fill="#00E0FF"/>
  <circle cx="50" cy="26" r="2" fill="#00E0FF"/>
  <circle cx="46" cy="38" r="2" fill="#FFC857"/>

  <!-- Wireless signal waves from physical -->
  <path d="M22 16 C24 14 26 14 28 16" stroke="#004B87" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M24 12 C26 10 30 10 32 12" stroke="#004B87" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Cloud connection above digital twin -->
  <path d="M40 12 C40 10 42 8 44 8 C45 6 47 6 48 8 C50 8 52 10 52 12 C52 14 50 16 48 16 L44 16 C42 16 40 14 40 12 Z" stroke="#00E0FF" stroke-width="1.5" fill="none"/>

  <!-- Sync symbol -->
  <g transform="translate(32, 8)">
    <path d="M -2 -2 L 2 -2 L 0 -4 Z" fill="#FFC857"/>
    <path d="M 2 2 L -2 2 L 0 4 Z" fill="#FFC857"/>
  </g>

  <!-- 3D depth -->
  <rect x="36" y="20" width="20" height="24" rx="2" stroke="#00E0FF" stroke-width="1" fill="none" opacity="0.2" transform="translate(1.5, 1.5)"/>
</svg>
