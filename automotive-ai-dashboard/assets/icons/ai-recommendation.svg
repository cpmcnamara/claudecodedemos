<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brain/AI core -->
  <path d="M32 12 C38 12 42 16 42 22 C46 22 48 24 48 28 C48 32 46 34 42 34 C42 40 38 44 32 44 C26 44 22 40 22 34 C18 34 16 32 16 28 C16 24 18 22 22 22 C22 16 26 12 32 12 Z" stroke="#00E0FF" stroke-width="2.5" fill="none"/>

  <!-- Neural pathways inside brain -->
  <path d="M28 20 L32 24 L36 20" stroke="#00E0FF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M26 28 L32 28 L38 28" stroke="#00E0FF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M28 36 L32 32 L36 36" stroke="#00E0FF" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Recommendation lightbulb -->
  <circle cx="52" cy="12" r="6" stroke="#FFC857" stroke-width="2" fill="none"/>
  <path d="M52 8 L52 4" stroke="#FFC857" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="16" x2="52" y2="19" stroke="#FFC857" stroke-width="2" stroke-linecap="round"/>
  <circle cx="52" cy="12" r="3" fill="#FFC857" opacity="0.4"/>

  <!-- Connection line from brain to insight -->
  <path d="M42 18 L46 14" stroke="#00E0FF" stroke-width="2" stroke-dasharray="2 2" stroke-linecap="round"/>

  <!-- Data input streams -->
  <line x1="8" y1="28" x2="16" y2="28" stroke="#004B87" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-small)"/>
  <line x1="12" y1="20" x2="18" y2="22" stroke="#004B87" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-small)"/>
  <line x1="12" y1="36" x2="18" y2="34" stroke="#004B87" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-small)"/>

  <!-- Output action arrows -->
  <line x1="32" y1="44" x2="32" y2="52" stroke="#FFC857" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-action)"/>
  <circle cx="32" cy="56" r="3" fill="#FFC857"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 8 2.5, 0 5" fill="#004B87" />
    </marker>
    <marker id="arrow-action" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FFC857" />
    </marker>
  </defs>

  <!-- 3D depth -->
  <circle cx="32" cy="28" r="3" fill="#00E0FF" opacity="0.2"/>
</svg>
