<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Flow nodes -->
  <circle cx="12" cy="32" r="6" stroke="#00E0FF" stroke-width="2.5" fill="none"/>
  <circle cx="32" cy="16" r="6" stroke="#00E0FF" stroke-width="2.5" fill="none"/>
  <circle cx="32" cy="48" r="6" stroke="#00E0FF" stroke-width="2.5" fill="none"/>
  <circle cx="52" cy="32" r="6" stroke="#00E0FF" stroke-width="2.5" fill="none"/>

  <!-- Flow connections -->
  <path d="M17 30 L27 18" stroke="#00E0FF" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <path d="M17 34 L27 46" stroke="#00E0FF" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <path d="M37 18 L47 30" stroke="#00E0FF" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <path d="M37 46 L47 34" stroke="#00E0FF" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- Data flow particles -->
  <circle cx="22" cy="24" r="1.5" fill="#FFC857"/>
  <circle cx="42" cy="24" r="1.5" fill="#FFC857"/>
  <circle cx="22" cy="40" r="1.5" fill="#FFC857"/>
  <circle cx="42" cy="40" r="1.5" fill="#FFC857"/>

  <!-- Center nodes filled to show activity -->
  <circle cx="32" cy="16" r="3" fill="#00E0FF" opacity="0.4"/>
  <circle cx="32" cy="48" r="3" fill="#00E0FF" opacity="0.4"/>

  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00E0FF" />
    </marker>
  </defs>

  <!-- 3D depth shadow -->
  <circle cx="52" cy="32" r="6" stroke="#00E0FF" stroke-width="1" fill="none" opacity="0.2" transform="translate(2, 2)"/>
</svg>
